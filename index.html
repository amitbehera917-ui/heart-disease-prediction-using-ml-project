<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction using ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-section { display: none; }
        .page-section.active { display: block; }
        #timerDisplay { font-weight: 600; color: #c0392b; font-size: 14px; margin-bottom: 15px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="split-screen">
        <!-- Left Side: Yellow Background with Heart Logo -->
        <div class="left-side">
            <div class="heart-icon-container">
                <svg viewBox="0 0 24 24" class="real-heart-svg">
                    <path fill="#e74c3c" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <h1>Heart Disease<br>Prediction</h1>
            <button id="logoutBtn" onclick="logoutUser()" style="display:none; margin-top: 20px; background: #c0392b; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: 600;">Logout / Switch User</button>
        </div>

        <!-- Right Side: Dynamic Sections -->
        <div class="right-side" style="overflow-y: auto; padding: 20px 0;">
            
            <!-- SECTION 1: SIGN UP FORM -->
            <div id="signupSection" class="page-section active">
                <div class="form-container">
                    <h2>User Registration</h2>
                    <form onsubmit="handleSignup(event)">
                        <div class="input-box"><input type="text" id="regUser" placeholder="Choose Username" required></div>
                        <div class="input-box"><input type="tel" id="regMobile" placeholder="Enter Mobile Number" pattern="[0-9]{10}" maxlength="10" required></div>
                        <div class="input-box"><input type="password" id="regPass" placeholder="Create Password" required></div>
                        <button type="submit" class="action-btn">Register & Send OTP</button>
                    </form>
                </div>
            </div>

            <!-- SECTION 2: OTP VERIFICATION WITH 40 SECONDS TIMER -->
            <div id="otpSection" class="page-section">
                <div class="form-container">
                    <h2>Enter Security OTP</h2>
                    <div id="timerDisplay">OTP Expires in: <span id="timeCount">40</span>s</div>
                    <form onsubmit="handleOTPVerify(event)">
                        <div class="input-box"><input type="text" id="enteredOTP" placeholder="Enter 4-digit OTP" maxlength="4" required></div>
                        <button type="submit" class="action-btn">Verify & Open Tool</button>
                    </form>
                </div>
            </div>

            <!-- SECTION 3: HEART DISEASE PREDICTOR WITH PATIENT NAME & DROPDOWN SEX -->
            <div id="predictorSection" class="page-section">
                <div class="form-container" style="max-width: 520px;">
                    <h2 style="font-size: 20px; margin-bottom: 15px;">Patient Medical Data Entry</h2>
                    <button id="downloadPdfBtn" class="action-btn" onclick="downloadMedicalReport()" style="margin-top: 10px; background-color: #27ae60; display: none;">Download Medical Report (PDF)</button>
                    <form id="predictionForm" class="form-grid">
                        <!-- Patient Name Field -->
                        <div class="input-box" style="grid-column: span 2; margin-bottom: 8px;">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Patient Full Name</label>
                            <input type="text" id="patientName" placeholder="Enter Patient Name (e.g. Amit Behera)" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e0; background-color: #fff; border-radius: 6px; font-size: 13px;">
                        </div>

                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Patient Age</label>
                            <input type="number" id="age" placeholder="e.g. 63" value="63">
                        </div>
                        
                        <!-- Dropdown Sex Selection -->
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Patient Sex</label>
                            <select id="sex" style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e0; background-color: #fff; border-radius: 6px; font-size: 13px; color: #2d3748; outline: none; font-weight: 500;">
                                <option value="1">Male</option>
                                <option value="0">Female</option>
                            </select>
                        </div>

                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Chest Pain Type (0-3)</label>
                            <input type="number" id="cp" placeholder="0 to 3" value="3">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Blood Pressure</label>
                            <input type="number" id="trestbps" placeholder="e.g. 145" value="145">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Cholesterol Level</label>
                            <input type="number" id="chol" placeholder="e.g. 233" value="233">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Fasting Sugar > 120</label>
                            <input type="number" id="fbs" placeholder="1 or 0" value="1">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Resting ECG (0-2)</label>
                            <input type="number" id="restecg" placeholder="0 to 2" value="0">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Max Heart Rate</label>
                            <input type="number" id="thalach" placeholder="e.g. 150" value="150">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Exercise Angina</label>
                            <input type="number" id="exang" placeholder="1 or 0" value="0">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">ST Depression</label>
                            <input type="number" step="0.1" id="oldpeak" placeholder="e.g. 2.3" value="2.3">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">ST Slope (0-2)</label>
                            <input type="number" id="slope" placeholder="0 to 2" value="0">
                        </div>
                        <div class="input-box">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Major Vessels (0-4)</label>
                            <input type="number" id="ca" placeholder="0 to 4" value="0">
                        </div>
                        <div class="input-box" style="grid-column: span 2;">
                            <label style="font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-bottom: 3px;">Thal (0=Normal, 1=Fixed, 2=Reversible)</label>
                            <input type="number" id="thal" placeholder="0 to 3" value="1">
                        </div>
                    </form>
                    
                    <button id="predictBtn" class="action-btn" onclick="predictHeartDiseaseWithPatient()" style="margin-top: 15px;">Analyze Patient Data</button>
                    <div id="result" class="hidden"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let otpTimer;

        window.onload = function() {
            if(localStorage.getItem('isLoggedIn') === 'true') {
                showSection('predictorSection');
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                showSection('signupSection');
            }
        };

        function showSection(sectionId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function handleSignup(e) {
            e.preventDefault();
            const mobile = document.getElementById('regMobile').value;
            const generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
            
            localStorage.setItem('savedOTP', generatedOTP);
            localStorage.setItem('regUser', document.getElementById('regUser').value);
            
            alert(`[SIMULATION] OTP sent to Mobile +91 ${mobile} is: ${generatedOTP}`);
            showSection('otpSection');
            startOTPTimer();
        }

        function startOTPTimer() {
            let timeLeft = 40;
            const timeSpan = document.getElementById('timeCount');
            timeSpan.innerText = timeLeft;
            
            clearInterval(otpTimer);
            otpTimer = setInterval(() => {
                timeLeft--;
                timeSpan.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(otpTimer);
                    alert("OTP Expired! Please register again.");
                    localStorage.removeItem('savedOTP');
                    showSection('signupSection');
                }
            }, 1000);
        }

        function handleOTPVerify(e) {
            e.preventDefault();
            const userOTP = document.getElementById('enteredOTP').value;
            const correctOTP = localStorage.getItem('savedOTP');

            if(userOTP === correctOTP) {
                clearInterval(otpTimer);
                localStorage.setItem('isLoggedIn', 'true');
                alert("Verification Successful! Opening Prediction Tool.");
                showSection('predictorSection');
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                alert("Invalid OTP! Please try again.");
            }
        }

        function predictHeartDiseaseWithPatient() {
            const pName = document.getElementById('patientName').value.trim();
            if(!pName) {
                alert("Please enter the Patient Name first!");
                document.getElementById('patientName').focus();
                return;
            }
            if(typeof predictHeartDisease === 'function') {
                predictHeartDisease();
                setTimeout(() => {
                    const resDiv = document.getElementById('result');
                    if(resDiv && !resDiv.classList.contains('hidden')) {
                        resDiv.innerHTML = `<strong>Patient:</strong> ${pName}<br>` + resDiv.innerHTML;
                    }
                }, 100);
            } else {
                alert("Prediction function loaded from script.js");
            }
        }

        function logoutUser() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('savedOTP');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('signupSection').querySelector('form').reset();
            showSection('signupSection');
        }
        function downloadMedicalReport() {
    const element = document.getElementById('predictorSection');
    const patientName = document.getElementById('patientName').value || 'Patient_Report';
    
    // Options for PDF generation
    const opt = {
        margin:       0.5,
        filename:     `${patientName}_Heart_Report.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };

    // Generate and download PDF
    html2pdf().from(element).set(opt).save();
}
document.getElementById('downloadPdfBtn').style.display = 'block';
    </script>
</body>
</html>
